<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoLife — Sustainable Living Made Easy</title>
<style>
:root{--green:#167748;--dark:#135e3b;--mint:#eaf5e6;--bg:#f2f8ef;--text:#19392b;--muted:#60786a;--white:#fff;--line:#dce9d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(18px,calc((100% - 1050px)/2));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:46px;height:46px;border-radius:14px;background:#dff1d9;display:grid;place-items:center;font-size:27px;color:var(--green)}h1{font-size:22px;margin:0;color:var(--dark)}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.wrap{max-width:1050px;margin:auto;padding:18px}
nav{display:flex;gap:7px;overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:18px}
nav button{border:0;background:#f2f7f0;color:#397353;padding:11px 15px;border-radius:11px;cursor:pointer;font-weight:650;white-space:nowrap}nav button.active,button.primary{background:var(--green);color:white}
button{font:inherit;cursor:pointer}button:focus,input:focus,select:focus{outline:3px solid #b8ddad;outline-offset:2px}
main{display:grid;gap:15px}.hero{background:#dff1d9;border-radius:20px;padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--dark)}h2{margin:5px 0 8px;color:var(--dark);font-size:27px}h3{margin:0 0 12px;color:var(--dark)}p{line-height:1.5}.muted{color:var(--muted);font-size:14px}.bigicon{font-size:48px;background:#fff;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.stat{font-size:26px;font-weight:800;margin:4px 0}.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}.iconbox{width:46px;height:46px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:24px;flex-shrink:0}
button.primary,button.secondary,button.ghost{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.secondary{background:#e7f3e2;color:var(--dark)}.ghost{background:transparent;color:var(--green);padding:8px}.task{display:flex;align-items:center;gap:12px}.task .details{flex:1}.task h4{margin:0 0 4px;font-size:15px}.task p{margin:0;font-size:12px;color:var(--muted)}.task small{display:block;color:var(--green);margin-top:5px}.task button{font-size:12px;padding:9px}.bar{height:10px;background:#c5dfbd;border-radius:99px;overflow:hidden}.bar span{height:100%;display:block;background:var(--green);transition:width .2s}.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pillrow button{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:white;color:var(--dark)}.pillrow button.active{background:var(--green);color:white}
input,select{width:100%;padding:12px;border:1px solid #cfdfcb;border-radius:11px;font:inherit;background:white;color:var(--text)}label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}.product{display:flex;gap:13px;align-items:center}.product .emoji{width:64px;height:64px;display:grid;place-items:center;background:var(--mint);border-radius:14px;font-size:30px;flex-shrink:0}.product h4{margin:0 0 4px}.product p{margin:4px 0;font-size:13px;color:var(--muted)}.price{color:var(--green);font-weight:800}.notice{background:#dff1d9;color:var(--dark);padding:12px;border-radius:12px;margin-bottom:12px}.badge{border-radius:99px;padding:5px 9px;font-size:11px;background:#e7f3e2;color:var(--green);font-weight:800}.hidden{display:none}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}
@media(max-width:650px){.wrap{padding:12px}.grid,.grid.three{grid-template-columns:1fr}.hero{padding:18px}.hero h2{font-size:23px}.card{padding:14px}header{padding:12px 16px}.task{align-items:flex-start}.task button{margin-top:2px}}
</style>
</head>
<body>
<header><div class="logo">🌿</div><div><h1>EcoLife</h1><p>Sustainable Living Made Easy</p></div><span style="margin-left:auto" class="badge">Interactive demo</span></header>
<div class="wrap">
<nav id="nav">
<button class="active" data-tab="Home">🏡 Home</button><button data-tab="Explore">🌱 Explore</button><button data-tab="Track">💧 Energy & Water</button><button data-tab="Rewards">🏆 Rewards</button><button data-tab="Profile">👤 Profile</button>
</nav>
<div id="notice" class="notice hidden" role="status"></div>
<main id="app"></main>
<footer>🌿 EcoLife — Better choices today, a greener tomorrow.<br>Demo data only; no account or cloud storage is connected.</footer>
</div>
<script>
const tasks=[
{id:1,title:"Bring a reusable water bottle",desc:"Avoid single-use plastic today",points:20,icon:"🥤"},
{id:2,title:"Switch off unused lights",desc:"Save electricity at home",points:15,icon:"💡"},
{id:3,title:"Use a reusable shopping bag",desc:"Skip disposable carrier bags",points:20,icon:"🛍️"},
{id:4,title:"Sort your recyclables",desc:"Separate paper, plastic and cans",points:15,icon:"♻️"},
{id:5,title:"Take a shorter shower",desc:"Try saving water today",points:15,icon:"🚿"}];
const products=[
{name:"Reusable Water Bottle",category:"Food & Drink",price:"$19.90",icon:"🥤",desc:"A refillable bottle that helps reduce single-use plastic waste.",tip:"Use it daily and refill instead of buying bottled water."},
{name:"Organic Cotton T-shirt",category:"Clothing",price:"$24.90",icon:"👕",desc:"A cotton clothing option to consider when shopping for durable basics.",tip:"Choose durable clothes and wear them for longer."},
{name:"Water-Efficient Showerhead",category:"Home",price:"$45.00",icon:"🚿",desc:"Designed to reduce water flow while maintaining a comfortable shower.",tip:"Check the product's water-efficiency rating before buying."},
{name:"Reusable Shopping Bag",category:"Food & Drink",price:"$5.90",icon:"🛍️",desc:"A reusable alternative to disposable shopping bags.",tip:"Keep one in your school bag so it is ready when needed."}];
const waste=[
{name:"Plastic bottle",kind:"Plastic",icon:"🥤",advice:"Empty and rinse it. Check local recycling rules and place it in the appropriate recycling bin."},
{name:"Paper and cardboard",kind:"Paper",icon:"📦",advice:"Keep paper clean and dry. Flatten cardboard boxes before recycling."},
{name:"Glass bottle",kind:"Glass",icon:"🫙",advice:"Empty and rinse it. Check whether glass is accepted at your local collection point."},
{name:"Aluminium can",kind:"Metal",icon:"🥫",advice:"Empty and rinse the can before placing it in the appropriate recycling bin."},
{name:"Food scraps",kind:"Organic",icon:"🍎",advice:"Consider a suitable food-waste collection or composting programme."},
{name:"Used battery",kind:"Special waste",icon:"🔋",advice:"Do not place batteries in ordinary recycling bins. Use a designated battery collection point."}];
let state={tab:"Home",done:[],saved:[],water:"120",electricity:"36",name:"Eco Explorer",lang:"English",category:"All",query:"",detail:null};
const app=document.getElementById("app"),nav=document.getElementById("nav"),notice=document.getElementById("notice");
function points(){return 120+state.done.reduce((n,id)=>n+(tasks.find(t=>t.id===id)?.points||0),0)}
function toast(s){notice.textContent=s;notice.classList.remove("hidden");setTimeout(()=>notice.classList.add("hidden"),3200)}
function go(tab){state.tab=tab;state.detail=null;render()}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)go(b.dataset.tab)});
function taskCard(t){let done=state.done.includes(t.id);return `<div class="card task"><div class="iconbox">${t.icon}</div><div class="details"><h4>${t.title}</h4><p>${t.desc}</p><small>+${t.points} points</small></div><button class="${done?'secondary':'primary'}" data-task="${t.id}">${done?'Done ✓':'Complete'}</button></div>`}
function home(){return `<div class="hero"><div><div class="eyebrow">YOUR ECO JOURNEY</div><h2>Hello, ${esc(state.name)}! 🌱</h2><p>Small steps today make a greener tomorrow.</p><div class="stat">${state.done.length}/5 tasks completed</div><div class="bar" style="max-width:360px"><span style="width:${state.done.length*20}%"></span></div><p class="muted">${state.done.length===5?"Amazing! You completed every daily task.":"Complete a task to earn points and build greener habits."}</p><button class="primary" data-go="Explore">Explore eco actions →</button></div><div class="bigicon">🌍</div></div>
<div class="grid"><div class="card"><div>🏆 Eco points</div><div class="stat">${points()}</div><div class="muted">Earn points from challenges</div></div><div class="card"><div>✅ Tasks completed</div><div class="stat">${state.done.length}</div><div class="muted">Your sustainable actions</div></div></div>
<h3>Today's eco-challenges</h3><div class="grid">${tasks.slice(0,3).map(taskCard).join("")}</div><button class="secondary" data-go="Rewards">View all rewards</button>`}
function explore(){if(state.detail){let p=products.find(p=>p.name===state.detail);return `<div class="card"><button class="ghost" data-back>← Back to products</button><div class="hero" style="margin-top:12px"><div class="bigicon">${p.icon}</div><div><h2>${p.name}</h2><div class="price">${p.price}</div></div></div><p>${p.desc}</p><div class="card" style="background:#f2f8ef"><b>Sustainable living tip</b><p>${p.tip}</p></div><button class="${state.saved.includes(p.name)?'secondary':'primary'}" data-save="${p.name}">${state.saved.includes(p.name)?'♥ Saved to favourites':'♡ Save to favourites'}</button></div>`}
let list=products.filter(p=>(state.category==="All"||p.category===state.category));return `<h2>Explore & learn</h2><p class="muted">Discover greener choices for everyday life.</p><h3>Eco-friendly products</h3><div class="pillrow">${["All","Food & Drink","Home","Clothing"].map(c=>`<button class="${state.category===c?'active':''}" data-category="${c}">${c}</button>`).join("")}</div><div class="grid">${list.map(p=>`<div class="card product"><div class="emoji">${p.icon}</div><div style="flex:1"><h4>${p.name}</h4><p>${p.category}</p><div class="price">${p.price}</div><button class="secondary" style="margin-top:8px" data-detail="${p.name}">View details</button></div></div>`).join("")}</div><h3 style="margin-top:18px">♻️ Recycling guide</h3><p class="muted">Search an item to learn how to dispose of it responsibly.</p><input id="wasteSearch" placeholder="e.g. plastic bottle, battery" value="${esc(state.query)}"><div class="grid" style="margin-top:12px">${waste.filter(w=>(w.name+" "+w.kind).toLowerCase().includes(state.query.toLowerCase())).map(w=>`<div class="card"><div class="row"><div class="iconbox">${w.icon}</div><div><b>${w.name}</b><div class="muted">${w.kind}</div></div></div><p>${w.advice}</p></div>`).join("")||"<p>No matching item. Try another search term.</p>"}</div>`}
function track(){return `<h2>Energy & water tracker</h2><p class="muted">Record your usage and keep an eye on household resources.</p><div class="grid"><div class="card"><div class="row"><div class="iconbox">💧</div><div><h3>Water usage</h3><span class="muted">Litres for your chosen period</span></div></div><label for="water">Water usage (litres)</label><input id="water" type="number" min="0" value="${esc(state.water)}"></div><div class="card"><div class="row"><div class="iconbox">⚡</div><div><h3>Electricity usage</h3><span class="muted">Kilowatt-hours (kWh)</span></div></div><label for="electricity">Electricity usage (kWh)</label><input id="electricity" type="number" min="0" value="${esc(state.electricity)}"></div></div><button class="primary" data-update>Update usage</button><h3>Tips for you</h3><div class="grid"><div class="card">🚿 <b>Reduce water waste</b><p>Turn off the tap while brushing your teeth and keep showers efficient.</p></div><div class="card">💡 <b>Save electricity</b><p>Switch off lights and appliances when they are not needed.</p></div><div class="card">☀️ <b>Choose efficient products</b><p>Look for water- and energy-efficient product labels.</p></div></div><p class="muted">Demo only: usage is entered manually. The app does not connect to smart meters or verify savings.</p>`}
function rewards(){let badges=[["🌱","Green Starter",state.done.length>=1],["💧","Water Saver",state.done.includes(5)],["⚡","Energy Hero",state.done.includes(2)],["♻️","Recycling Champion",state.done.includes(4)]];return `<h2>Rewards & challenges</h2><div class="hero"><div><div class="eyebrow">YOUR ECO POINTS</div><div class="stat" style="font-size:38px">${points()}</div><p>${Math.max(0,200-points())} points until your 200-point milestone.</p><div class="bar"><span style="width:${Math.min(100,points()/200*100)}%"></span></div></div><div class="bigicon">🏆</div></div><h3>Your badges</h3><div class="grid three">${badges.map(b=>`<div class="card" style="text-align:center"><div style="font-size:34px">${b[0]}</div><b>${b[1]}</b><p><span class="badge" style="${b[2]?'':'background:#eee;color:#777'}">${b[2]?'Unlocked':'Locked'}</span></p></div>`).join("")}</div><h3>All daily challenges</h3><div class="grid">${tasks.map(taskCard).join("")}</div><p class="muted">Points and badges are demonstration values stored in this browser.</p>`}
function profile(){return `<h2>Your profile</h2><div class="hero"><div><div class="bigicon">👤</div></div><div style="flex:1"><h2>${esc(state.name)}</h2><p>EcoLife member</p><span class="badge">${state.done.length>=4?'Eco Champion':state.done.length>=1?'Eco Starter':'New Explorer'}</span></div></div><div class="grid three"><div class="card"><div class="stat">${points()}</div><div class="muted">Points</div></div><div class="card"><div class="stat">${state.done.length}</div><div class="muted">Tasks</div></div><div class="card"><div class="stat">${state.saved.length}</div><div class="muted">Saved products</div></div></div><div class="card"><h3>Personal settings</h3><label for="displayName">Display name</label><input id="displayName" value="${esc(state.name)}"><label for="language">App language</label><select id="language">${["English","简体中文","繁體中文","Bahasa Melayu","தமிழ்"].map(l=>`<option ${state.lang===l?'selected':''}>${l}</option>`).join("")}</select><p class="muted">Language selection is available in this demo, but full translations are not yet implemented.</p><button class="primary" data-profile-save>Save settings</button></div><div class="card"><h3>Saved products</h3>${state.saved.length?state.saved.map(p=>`<div class="row" style="padding:8px 0"><span style="flex:1">${esc(p)}</span><button class="ghost" data-unsave="${p}">Remove</button></div>`).join(""):'<p class="muted">No saved products yet. Visit Explore and save a product you like.</p>'}</div><button class="secondary" data-reset>Reset demo progress</button>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));app.innerHTML=state.tab==="Home"?home():state.tab==="Explore"?explore():state.tab==="Track"?track():state.tab==="Rewards"?rewards():profile()}
app.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;
if(b.dataset.go)go(b.dataset.go);
if(b.dataset.task){let id=+b.dataset.task;if(!state.done.includes(id)){state.done.push(id);toast("Challenge completed! You earned "+tasks.find(t=>t.id===id).points+" points.");render()}else toast("You have already completed this challenge.")}
if(b.dataset.category){state.category=b.dataset.category;render()}
if(b.dataset.detail){state.detail=b.dataset.detail;render()}
if(b.hasAttribute("data-back")){state.detail=null;render()}
if(b.dataset.save){if(state.saved.includes(b.dataset.save))state.saved=state.saved.filter(p=>p!==b.dataset.save);else state.saved.push(b.dataset.save);render();toast("Your favourites have been updated.")}
if(b.dataset.update){let w=document.getElementById("water").value,el=document.getElementById("electricity").value;if(w===""||el===""||+w<0||+el<0||!Number.isFinite(+w)||!Number.isFinite(+el)){toast("Enter valid non-negative usage values.");return}state.water=w;state.electricity=el;toast("Your usage entries are updated.");render()}
if(b.hasAttribute("data-profile-save")){state.name=document.getElementById("displayName").value.trim()||"Eco Explorer";state.lang=document.getElementById("language").value;render();toast("Profile settings saved in this browser.")}
if(b.dataset.unsave){state.saved=state.saved.filter(p=>p!==b.dataset.unsave);render()}
if(b.hasAttribute("data-reset")){if(confirm("Reset all demo progress and saved products?")){state.done=[];state.saved=[];state.water="120";state.electricity="36";render();toast("Demo progress reset.")}}
});
app.addEventListener("input",e=>{if(e.target.id==="wasteSearch"){let pos=e.target.selectionStart;state.query=e.target.value;render();let input=document.getElementById("wasteSearch");input.focus();input.setSelectionRange(pos,pos)}});
render();
</script>
</body>
</html>
